[workspace]
resolver = "3"
members = ["crates/nyx-desktop-widgets-core", "apps/desktop-widgets"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/nyxos-project/nyx-desktop-widgets"

[workspace.dependencies]
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gtk4-layer-shell = "0.8"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "394ddf8193797cd1f420fac98b097d04fa75f0e2" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "976fed940841a2a505ffe644f632cb60e12988a8" }
# The plugin system lives in nyx-bar until it moves to nyx-core and nyx-design.
nyx-plugin = { git = "https://github.com/design-nexus/nyx-bar.git", rev = "34b7c0cea7b2c8d5d46e882b68579f7a35d27dc5" }
nyx-plugin-host = { git = "https://github.com/design-nexus/nyx-bar.git", rev = "34b7c0cea7b2c8d5d46e882b68579f7a35d27dc5" }
nyx-plugin-protocol = { git = "https://github.com/design-nexus/nyx-bar.git", rev = "34b7c0cea7b2c8d5d46e882b68579f7a35d27dc5" }
nyx-plugin-view = { git = "https://github.com/design-nexus/nyx-bar.git", rev = "34b7c0cea7b2c8d5d46e882b68579f7a35d27dc5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"

[profile.release]
lto = "thin"
strip = true
