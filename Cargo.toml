[workspace]
resolver = "3"
members = ["crates/nyx-desktop-widgets-core", "apps/desktop-widgets", "plugins/upnext"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/nyxos-project/nyx-desktop-widgets"

[workspace.dependencies]
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gtk4-layer-shell = "0.8"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "e478d834d7d3c482cba6af4a3fd1c60f7390ae89" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "aec4b032c92157cbcdc386aa97730f432300d5c4" }
# The plugin system: nyx-core, and its GTK drawing in nyx-design.
nyx-plugin = { git = "https://github.com/design-nexus/nyx-core.git", rev = "e478d834d7d3c482cba6af4a3fd1c60f7390ae89" }
nyx-plugin-host = { git = "https://github.com/design-nexus/nyx-core.git", rev = "e478d834d7d3c482cba6af4a3fd1c60f7390ae89" }
nyx-plugin-sdk = { git = "https://github.com/design-nexus/nyx-core.git", rev = "e478d834d7d3c482cba6af4a3fd1c60f7390ae89" }
nyx-plugin-protocol = { git = "https://github.com/design-nexus/nyx-core.git", rev = "e478d834d7d3c482cba6af4a3fd1c60f7390ae89" }
nyx-plugin-view = { git = "https://github.com/design-nexus/nyx-design.git", rev = "aec4b032c92157cbcdc386aa97730f432300d5c4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"

[profile.release]
lto = "thin"
strip = true

