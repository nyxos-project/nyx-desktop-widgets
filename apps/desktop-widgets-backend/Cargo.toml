[package]
name = "nyx-desktop-widgets-backend"
version = "0.1.0"
description = "Nyx Desktop Widgets without GTK: plugins, layout, placement and visibility, for its Quickshell interface"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-desktop-widgets-backend"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
gio = "0.22"
glib = "0.22"
nyx-desktop.workspace = true
nyx-desktop-widgets-core = { path = "../../crates/nyx-desktop-widgets-core" }
nyx-plugin.workspace = true
nyx-plugin-host.workspace = true
nyx-plugin-protocol.workspace = true
nyx-theme-core = { git = "https://github.com/design-nexus/nyx-design.git", rev = "4f8e16d6ae3dbc2a14091271e3b6bb29902c0df4" }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "32f0c5e154fc44c763b8ecd80d35a3b298723afa" }
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
